name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Passo proprio, e nao typescript.typeCheck no nuxt.config: la a
      # checagem rodaria em todo build de desenvolvimento e deixaria o ciclo
      # local lento sem necessidade.
      #
      # Depende de npm ci ter rodado: o nuxt typecheck usa os tipos gerados
      # em .nuxt/, que nascem do postinstall (nuxt prepare).
      - name: Verificacao de tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
